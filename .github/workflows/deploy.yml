name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *' # diário: publica o conteúdo novo do submodule (ADR 0001)
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # No nível do job para o `if` do passo de deploy enxergar (env de passo não vale no próprio `if`).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Conteúdo mais recente
        if: github.event_name != 'pull_request'
        run: git submodule update --remote conteudo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

      - name: Publicar no Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: yarn wrangler deploy
